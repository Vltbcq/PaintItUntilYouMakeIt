name: Release

# Exporte le jeu (Windows, et Linux / SteamOS) sur les serveurs de GitHub et publie une Release avec
# le .exe, le zip Windows et l'archive Linux. Si l'export Linux échoue, la Release sort quand même
# avec Windows seul (avertissement dans le journal).
# - À la main : onglet Actions > Release > Run workflow. Le numéro est calculé TOUT SEUL
#   à partir du dernier tag : « contenu » v0.4 → v0.5, « correctif » v0.4 → v0.4.1 (v0.4.1 → v0.4.2).
#   Le passage en v1.0 ne se fait jamais tout seul : il faut le saisir dans « version précise ».
# - Automatique aussi quand un tag de version est poussé à la main (v0.6...)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      type:
        description: "Type de version"
        type: choice
        options: ["contenu (v0.X)", "correctif (v0.X.Y)"]
        default: "contenu (v0.X)"
      version:
        description: "Version précise (facultatif, ex. v1.0) : remplace le calcul automatique"
        required: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique et les tags, pour le changelog

      - name: Calculer le numéro de version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac
          else
            LAST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
            LAST="${LAST:-v0.0}"
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            MI="${MI:-0}"; PA="${PA:-0}"
            case "${{ github.event.inputs.type }}" in
              correctif*) VERSION="v$MA.$MI.$((PA + 1))" ;;
              *)          VERSION="v$MA.$((MI + 1))" ;;
            esac
            echo "Dernière version : $LAST"
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::La version $VERSION existe déjà."
            exit 1
          fi
          if [ ! -f ".github/release-notes/$VERSION.md" ]; then
            echo "::warning::Pas de résumé .github/release-notes/$VERSION.md : la description reprendra les derniers commits."
          fi
          echo "Nouvelle version : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Télécharger Godot et les modèles d'export
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Numéro de version du jeu (affiché sur l'écran titre)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s/^config\/version=.*/config\/version=\"${VERSION#v}\"/" project.godot
          grep "config/version" project.godot

      - name: Importer le projet
        run: timeout 300 "$RUNNER_TEMP/godot" --headless --path . --import || true

      - name: Vérifier que tous les scripts compilent
        run: |
          timeout 300 "$RUNNER_TEMP/godot" --headless --path . res://tests/checkall.tscn 2>&1 | tee checkall.log
          grep -q "0 en erreur" checkall.log

      - name: Exporter le jeu (Windows)
        run: |
          mkdir -p builds
          timeout 600 "$RUNNER_TEMP/godot" --headless --path . --export-release "Windows Desktop" builds/PaintIt.exe
          test -s builds/PaintIt.exe
          cd builds && zip -q PaintIt-windows.zip PaintIt.exe *.dll && ls -la   # (les .dll : GodotSteam et Steam)

      - name: Exporter le jeu (Linux / SteamOS) et vérifier qu'il démarre
        id: linux
        continue-on-error: true   # un souci Linux ne bloque jamais la sortie Windows
        run: |
          timeout 600 "$RUNNER_TEMP/godot" --headless --path . --export-release "Linux" builds/PaintIt.x86_64
          test -s builds/PaintIt.x86_64
          chmod +x builds/PaintIt.x86_64
          cd builds
          # Test de démarrage : le jeu tourne 300 images sans écran, puis se ferme tout seul.
          # (dossier de sauvegarde à part, pour ne rien laisser traîner)
          HOME="$RUNNER_TEMP/linux_home" XDG_DATA_HOME="$RUNNER_TEMP/linux_home/data" \
            timeout 120 ./PaintIt.x86_64 --headless --quit-after 300 > linux_run.log 2>&1 || { cat linux_run.log; echo "Le jeu Linux ne démarre pas."; exit 1; }
          cat linux_run.log
          if grep -q "SCRIPT ERROR\|Parse Error\|Failed to load" linux_run.log; then
            echo "Erreurs au démarrage du jeu Linux."
            exit 1
          fi
          # .tar.gz : garde le droit d'exécution (un zip le perd)
          tar -czf PaintIt-linux.tar.gz PaintIt.x86_64 *.so   # (les .so : GodotSteam et Steam)
          ls -la

      - name: "Linux en échec : la Release sort avec Windows seul"
        if: steps.linux.outcome != 'success'
        run: |
          rm -f builds/PaintIt-linux.tar.gz
          echo "::warning::L'export Linux a échoué : cette Release ne contient que Windows. Voir l'étape « Exporter le jeu (Linux / SteamOS) »."

      - name: Écrire la description (résumé court + lien vers le changelog détaillé)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Court (4-5 lignes) + lien vers le changelog détaillé : voir .github/scripts/release_body.sh
          bash .github/scripts/release_body.sh "$VERSION" > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Paint It Until You Make It ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG_RELEASE.md
          files: |
            builds/PaintIt.exe
            builds/PaintIt-windows.zip
            builds/PaintIt-linux.tar.gz

  discord:
    # Une fois la Release publiée : annonce dans le salon Discord (si le secret DISCORD_WEBHOOK existe)
    needs: export
    uses: ./.github/workflows/discord.yml
    with:
      version: ${{ needs.export.outputs.version }}
    secrets: inherit
